---
# provision.yml — build the adsb-watch server from scratch.
#
#   ansible-playbook -i inventory.ini provision.yml
#
# Idempotent; safe to re-run.  Builds the SERVER only.
#
# NOT done here, because skynet owns them and two writers of one resource is
# how they silently diverge (both used to live here, hardcoded to dmz):
#   * public DNS for adsb.n0gq.org -> skynet/ansible/dns-public-services.yml
#   * the us/eu nginx vhost        -> skynet/ansible/configure.yml, tag
#                                     nginx_adsb, template adsb-nginx.j2
- name: Build the adsb-watch server
  hosts: adsb
  become: true
  gather_facts: true

  vars:
    app_dir: /home/jfrancis/adsb-watch
    http_port: 8086
    ws_port: 8765
    # govt-data is itself being moved off dmz (skynet/dmz-modernize.md).  It is
    # a variable so this playbook does not need editing when it lands.
    govt_data_url: "http://10.1.17.42:8091"
    # govt-data API credentials (HTTP Basic). NOT stored in this (public) repo:
    # read at deploy time from the govt-data service's own auth.json on the
    # control node. Override with -e govt_data_user=... -e govt_data_pass=...
    # (e.g. for a different govt-data instance or if the secret rotates).
    govt_data_user: "aprs"
    govt_data_pass: >-
      {{ (lookup('file', '~/Dropbox/build/govt-data/auth.json')
          | from_json).users[govt_data_user] }}

  tasks:
    - name: Install Python3 venv and pip
      apt:
        # update_cache is not optional here.  The `generic` base image ships
        # with /var/lib/apt/lists emptied, so on a freshly cloned VM every
        # package name fails to resolve -- "No package matching 'python3-venv'
        # is available" on a machine where it plainly is available.
        update_cache: true
        cache_valid_time: 3600
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present
      tags: [deploy]

    - name: Sync adsb-watch source
      ansible.posix.synchronize:
        src: ~/Dropbox/build/adsb-watch/
        dest: "{{ app_dir }}/"
        delete: false
        rsync_opts:
          - "--exclude=ansible/"
          - "--exclude=venv/"
          - "--exclude=__pycache__/"
          - "--exclude=.git/"
          - "--chown=jfrancis:jfrancis"
      tags: [deploy]

    # The KMZ overlay is gitignored and excluded from the sync above; copy it
    # explicitly so --kml has a file to load. Skips cleanly if not present.
    - name: Check for local COPA KMZ overlay
      delegate_to: localhost
      become: false
      stat:
        path: ~/Dropbox/build/adsb-watch/COPA_v7_01-12-2026.kmz
      register: local_kmz
      tags: [deploy]

    - name: Copy COPA KMZ overlay
      copy:
        src: ~/Dropbox/build/adsb-watch/COPA_v7_01-12-2026.kmz
        dest: "{{ app_dir }}/COPA_v7_01-12-2026.kmz"
        owner: jfrancis
        group: jfrancis
        mode: '0644'
      when: local_kmz.stat.exists
      tags: [deploy]

    - name: Create Python venv
      become_user: jfrancis
      command: python3 -m venv {{ app_dir }}/venv
      args:
        creates: "{{ app_dir }}/venv/bin/activate"
      tags: [deploy]

    - name: Install Python dependencies
      become_user: jfrancis
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
      tags: [deploy]

    - name: Create environment file with govt-data credentials
      notify: Restart adsb-watch
      copy:
        dest: /etc/adsb-watch.env
        content: |
          GOVT_DATA_USER={{ govt_data_user }}
          GOVT_DATA_PASS={{ govt_data_pass }}
        owner: root
        group: jfrancis
        mode: '0640'
      tags: [deploy]

    - name: Install systemd service
      copy:
        dest: /etc/systemd/system/adsb-watch.service
        owner: root
        group: root
        mode: '0644'
        content: |
          # ANSIBLE MANAGED (adsb-watch/ansible/provision.yml)
          [Unit]
          Description=ADS-B Watch (web radar, internet feeds)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=jfrancis
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=/etc/adsb-watch.env
          Environment=PYTHONUNBUFFERED=1
          # This VM has no RTL-SDR, so traffic comes from --internet.
          # Web UI on :{{ http_port }} (HTTP) and :{{ ws_port }} (WebSocket);
          # the hub vhost fronts both -- see skynet configure.yml, tag
          # nginx_adsb.  radar.js picks ws://host:{{ ws_port }} over plain http
          # and wss://host/ws over TLS, so BOTH ports matter.
          #
          # --expiry 30 (default 10) because this instance is fed by an
          # aggregator, not by RF.  adsb.lol rate-limits, and a 429 backs the
          # poller off 2 -> 4 -> 8 s; with a 10 s expiry the whole fleet was
          # deleted before the next successful poll, so aircraft appeared for
          # ~10 s, faded, vanished, and repeated on a ~27 s cycle.  A 10 s
          # expiry is right for RF, where silence really does mean out of
          # range; for a polled feed it just means "between polls".
          # --predict-stale 8 keeps the UI honest about what is dead-reckoned.
          #
          # THIS PLAYBOOK IS THE ONLY WRITER of the deployed unit.  The
          # in-repo adsb-watch.service is a reference copy; the two silently
          # diverged once already (the deployed unit carried these two flags
          # and this template did not, so a deploy would have quietly undone
          # them), so keep them in step or delete the other one.
          #
          # The web scope-centre selector is left ENABLED here.  There is one
          # observer, so any viewer who re-centres moves the scope for
          # everyone -- acceptable now that the public vhost is behind basic
          # auth (skynet configure.yml, tag nginx_adsb).  Add
          # --no-web-recenter below to refuse it outright.
          ExecStart={{ app_dir }}/venv/bin/python3 {{ app_dir }}/main.py \
              --web --web-port {{ ws_port }} --http-port {{ http_port }} \
              --no-launch-dump1090 \
              --kml \
              --fixed-lat 39.3553696 --fixed-lon -104.6729929 --fixed-alt-ft 6750 \
              --govt-data-url {{ govt_data_url }} \
              --internet \
              --expiry 30 \
              --predict-stale 8
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
      notify: Restart adsb-watch
      tags: [deploy]

    # started, not restarted: `restarted` bounces the service on every run for
    # no reason and keeps the play permanently reporting changed.
    - name: Enable and start adsb-watch service
      systemd:
        name: adsb-watch
        enabled: true
        state: started
        daemon_reload: true
      tags: [deploy]

    # UFW is currently inactive on 10.1.17.20; this rule is a harmless no-op
    # for parity, and correctly scopes access to the VPN if UFW is enabled.
    - name: Allow web ports through UFW from the VPN
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        src: 10.1.0.0/23
      loop:
        - "8086"
        - "8765"
      tags: [deploy]

  handlers:
    - name: Restart adsb-watch
      systemd:
        name: adsb-watch
        state: restarted
        daemon_reload: true

    - name: Reload systemd
      systemd:
        daemon_reload: true


