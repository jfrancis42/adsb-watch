server {
    listen 80;
    listen [::]:80;
    server_name adsb.n0gq.org;
    return 301 https://$host$request_uri;
}

server {
    # nginx stream module owns TCP/443 and demuxes by SNI to loopback:444
    # with the PROXY protocol (see /etc/nginx/stream.d/). Every n0gq.org
    # vhost listens here, NOT on 443 directly.
    listen 127.0.0.1:444 ssl proxy_protocol;
    server_name adsb.n0gq.org;

    real_ip_header proxy_protocol;
    set_real_ip_from 127.0.0.1;

    # This vhost listens on :444 (behind the SNI stream demux), so an absolute
    # redirect would leak ":444" into the Location header. Emit relative
    # redirects; the browser resolves them against the public :443 URL.
    absolute_redirect off;

    ssl_certificate     /etc/letsencrypt/live/n0gq.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n0gq.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_conf_command    Groups X25519MLKEM768:X25519:prime256v1;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Land visitors on the radar page by default.
    location = / {
        return 302 /radar.html;
    }

    # WebSocket stream from the ADS-B engine (server --web-port 8765).
    # Same-origin wss://adsb.n0gq.org/ws is what web/radar.js dials over HTTPS.
    location /ws {
        proxy_pass         http://10.1.0.20:8765;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade              $http_upgrade;
        proxy_set_header   Connection           "upgrade";
        proxy_set_header   Host                 $host;
        proxy_set_header   X-Real-IP            $remote_addr;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
        proxy_read_timeout 86400s;
    }

    # Static radar UI (HTTP server, server --http-port 8086).
    location / {
        proxy_pass         http://10.1.0.20:8086;
        proxy_http_version 1.1;
        proxy_set_header   Host                 $host;
        proxy_set_header   X-Real-IP            $remote_addr;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
        proxy_read_timeout 60s;
    }
}
