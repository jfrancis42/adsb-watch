<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS-B Radar Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #status {
            position: relative;   /* anchors the #center-msg toast */
            padding: 10px;
            background: #001100;
            border-bottom: 1px solid #0f0;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        #status .left, #status .right {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        /* Indicator lights */
        .indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .indicator-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #300;
            border: 1px solid #500;
        }

        .indicator-light.on {
            background: #0f0;
            border-color: #0f0;
            box-shadow: 0 0 5px #0f0;
        }

        /* Dropdown controls */
        select {
            background: #001100;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 2px 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 3px #0f0;
        }

        select option {
            background: #001100;
            color: #0f0;
        }

        /* Sound checkboxes */
        input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #0f0;
            background: #001100;
            cursor: pointer;
            position: relative;
            vertical-align: middle;
            margin-right: 3px;
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: #0f0;
            font-size: 12px;
            top: -2px;
            left: 1px;
        }

        label {
            cursor: pointer;
            font-size: 12px;
        }

        /* Scope centre selector. Same CRT palette as the dropdowns so it
           reads as one panel rather than a bolted-on web form. */
        #center-input {
            background: #001100;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 2px 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            width: 7ch;
            text-transform: uppercase;
        }

        #center-input:focus {
            outline: none;
            box-shadow: 0 0 3px #0f0;
        }

        #center-input:disabled {
            border-color: #050;
            color: #060;
            cursor: not-allowed;
        }

        #center-input::placeholder {
            color: #060;
        }

        /* The readout flashes when the centre moves. On a shared instance
           the move may have been another viewer's doing, so the scope
           jumping needs something to point at. */
        #observer-pos.flash {
            color: #fff;
            text-shadow: 0 0 6px #0f0;
            transition: none;
        }

        /* A toast, not a bar item. It is visible for a few seconds; holding
           permanent width in the status bar for it pushes the whole bar onto
           a second row and steals scope height on every page forever. */
        #center-msg {
            position: absolute;
            top: 100%;
            left: 10px;
            z-index: 5;
            font-size: 12px;
            background: #001100;
            border: 1px solid #0f0;
            padding: 3px 8px;
            max-width: min(60ch, calc(100vw - 40px));
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #center-msg.show { opacity: 1; }
        #center-msg.error { color: #f55; border-color: #f55; }

        /* The GPS light is a control, not just a lamp: clicking it hands the
           centre to gpsd or takes it back. Three states, because "off" and
           "there is no GPS here" are different facts and a user deciding
           whether to click needs to tell them apart. */
        .indicator.clickable {
            cursor: pointer;
            user-select: none;
        }

        .indicator.clickable:hover .indicator-light {
            box-shadow: 0 0 5px #0f0;
        }

        .indicator.unavailable {
            cursor: default;
            opacity: 0.45;
        }

        .indicator.unavailable:hover .indicator-light {
            box-shadow: none;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        /* The map, when a map view is selected. It sits BEHIND the canvas and
           fills the whole scope area, not just the outer range ring: the map
           is context, and cutting it off at the ring threw away most of the
           window. Only the map extends -- aircraft, trails and airports are
           still bounded by the ring. The status bar is a sibling outside
           #canvas-container, so it keeps its own dark background.

           pointer-events:none because the map is SLAVED to the radar: its
           centre is the observer and its zoom is derived from the range ring.
           A user drag would silently desynchronise the two, and the aircraft
           would then be drawn in the wrong place over the map. */
        #map-layer {
            position: absolute;
            inset: 0;
            display: none;
            overflow: hidden;
            pointer-events: none;
            background: #000;
        }
        #map-layer.active { display: block; }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;   /* above #map-layer */
        }

        /* Position, tracks and airport count, bottom right over the scope.
           Moved out of the top bar because adding the View selector pushed
           that line into a second row, and a wrapped toolbar costs more
           vertical space than the scope can spare.

           The panel carries its own dark backing: it now sits over the map
           and the VFR chart, and green-on-cream is exactly the contrast
           problem the scope symbology already had. pointer-events:none so it
           never swallows a click meant for the scope. */
        #readout {
            position: absolute;
            right: 10px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            padding: 5px 8px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.72);
            color: #00ff00;
            font-size: 12px;
            line-height: 1.35;
            white-space: nowrap;
            text-align: right;
            pointer-events: none;
            z-index: 3;
        }

        .disconnected {
            color: #f00;
        }

        .connected {
            color: #0f0;
        }

        /* CRT scanline effect */
        #canvas-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }

        /* CRT glow */
        canvas {
            filter: blur(0.3px) contrast(1.1) brightness(1.05);
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="status">
            <div class="left">
                <span id="center-control" hidden>
                    Center:
                    <input type="text" id="center-input" placeholder="HOME"
                           maxlength="10" autocomplete="off" autocorrect="off"
                           autocapitalize="characters" spellcheck="false"
                           title="Airport code (KPAE, S43, DEN) or HOME. Press Enter.">
                </span>
                <span id="center-msg"></span>
            </div>
            <div class="right">
                <span>
                    View:
                    <select id="view-select">
                        <option value="radar" selected>RADAR</option>
                        <option value="map">MAP</option>
                        <option value="vfr">VFR</option>
                    </select>
                </span>
                <span>
                    Range:
                    <select id="range-select">
                        <option value="1">1 NM</option>
                        <option value="2">2 NM</option>
                        <option value="5" selected>5 NM</option>
                        <option value="10">10 NM</option>
                        <option value="20">20 NM</option>
                        <option value="50">50 NM</option>
                        <option value="100">100 NM</option>
                    </select>
                </span>
                <span>
                    Trail:
                    <select id="trail-select">
                        <option value="0">None</option>
                        <option value="10">10s</option>
                        <option value="30" selected>30s</option>
                        <option value="60">1 min</option>
                        <option value="120">2 min</option>
                        <option value="300">5 min</option>
                        <option value="-1">Full</option>
                    </select>
                </span>
                <span>
                    Projection:
                    <select id="projection-select">
                        <option value="0">None</option>
                        <option value="15">15s</option>
                        <option value="30">30s</option>
                        <option value="60" selected>60s</option>
                    </select>
                </span>
                <span>
                    Altitude:
                    <select id="altitude-mode-select">
                        <option value="asl" selected>ASL</option>
                        <option value="agl">AGL</option>
                    </select>
                </span>
                <span>
                    Alert Range:
                    <select id="alert-range-select">
                        <option value="0">None</option>
                        <option value="0.5">0.5 NM</option>
                        <option value="1" selected>1 NM</option>
                        <option value="2">2 NM</option>
                        <option value="3">3 NM</option>
                        <option value="5">5 NM</option>
                    </select>
                </span>
                <span class="indicator">
                    <span class="indicator-light" id="adsb-light"></span>
                    <span>1090</span>
                </span>
                <span class="indicator">
                    <span class="indicator-light" id="uat-light"></span>
                    <span>978</span>
                </span>
                <span class="indicator" id="gps-indicator">
                    <span class="indicator-light" id="gps-light"></span>
                    <span>GPS</span>
                </span>
                <span>
                    <label><input type="checkbox" id="sound-approaching" checked> Approaching</label>
                </span>
                <span>
                    <label><input type="checkbox" id="sound-enter" checked> Enter</label>
                </span>
                <span>
                    <label><input type="checkbox" id="sound-leave" checked> Leave</label>
                </span>
            </div>
        </div>
        <div id="canvas-container">
            <div id="map-layer"></div>
            <canvas id="radar"></canvas>
            <div id="readout">
                <span id="observer-pos">Observer: --</span>
                <span id="track-count">Tracks: 0</span>
            </div>
        </div>
    </div>

    <script src="radar.js"></script>
</body>
</html>
